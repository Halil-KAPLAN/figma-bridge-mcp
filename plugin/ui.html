<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      background: #1e1e1e;
      color: #e0e0e0;
      padding: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .logo { font-size: 16px; }
    .title { font-weight: 600; font-size: 13px; }
    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px;
      background: #2a2a2a;
      border-radius: 6px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #666;
      flex-shrink: 0;
    }
    .dot.connected { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
    .dot.connecting { background: #ff9800; animation: pulse 1s infinite; }
    .dot.error { background: #f44336; }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.3 } }
    .status-text { flex: 1; }
    .log {
      background: #111;
      border-radius: 4px;
      padding: 6px;
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      font-family: monospace;
      font-size: 10px;
      color: #888;
    }
    .log .entry { margin-bottom: 2px; }
    .log .ok { color: #4caf50; }
    .log .err { color: #f44336; }
    .log .info { color: #64b5f6; }
    .reconnect-btn {
      margin-top: 8px;
      width: 100%;
      padding: 6px;
      background: #333;
      border: 1px solid #444;
      border-radius: 4px;
      color: #e0e0e0;
      cursor: pointer;
      font-size: 11px;
      flex-shrink: 0;
    }
    .reconnect-btn:hover { background: #444; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🔌</span>
    <span class="title">Figma Bridge</span>
  </div>

  <div class="status-row">
    <div class="dot connecting" id="dot"></div>
    <span class="status-text" id="statusText">Connecting...</span>
  </div>

  <div class="log" id="log"></div>

  <button class="reconnect-btn" onclick="reconnect()">↺ Reconnect</button>

  <script>
    const WS_URL = 'ws://localhost:3055';
    let ws = null;
    let reconnectTimer = null;

    function addLog(msg, type = 'info') {
      const log = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = `entry ${type}`;
      const time = new Date().toLocaleTimeString([], { hour12: false });
      entry.textContent = `[${time}] ${msg}`;
      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;
    }

    function setStatus(state, text) {
      const dot = document.getElementById('dot');
      const statusText = document.getElementById('statusText');
      dot.className = `dot ${state}`;
      statusText.textContent = text;
    }

    function connect() {
      if (ws) { try { ws.close(); } catch(e) {} }

      setStatus('connecting', 'Connecting to bridge...');
      addLog('Connecting to ws://localhost:3055', 'info');

      try {
        ws = new WebSocket(WS_URL);
      } catch(e) {
        setStatus('error', 'Failed to create WebSocket');
        addLog(`Error: ${e.message}`, 'err');
        scheduleReconnect();
        return;
      }

      ws.onopen = () => {
        setStatus('connected', 'Connected to bridge ✓');
        addLog('Connected! MCP clients can now access Figma.', 'ok');
        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
        // Identify this connection as a real Figma plugin so the
        // bridge can tell plugins apart from proxy connections.
        try { ws.send(JSON.stringify({ type: 'hello', role: 'figma-plugin' })); } catch(e) {}
      };

      ws.onclose = (e) => {
        setStatus('error', 'Disconnected — retrying...');
        addLog(`Disconnected (${e.code})`, 'err');
        scheduleReconnect();
      };

      ws.onerror = () => {
        addLog('WebSocket error. Is server.js running?', 'err');
      };

      ws.onmessage = async (event) => {
        let msg;
        try { msg = JSON.parse(event.data); } catch(e) { return; }

        addLog(`← ${msg.command} (${msg.requestId})`, 'info');

        if (msg.command === 'figma_upload_image') {
          try {
            msg.params.images = await Promise.all(msg.params.images.map(img => prepareImage(img, msg.params.maxSize)));
          } catch (e) {
            ws.send(JSON.stringify({ requestId: msg.requestId, error: `Image decode failed: ${e.message || e}` }));
            addLog(`→ result (${msg.requestId}) ❌`, 'err');
            return;
          }
        }

        parent.postMessage({ pluginMessage: {
          type: 'execute',
          requestId: msg.requestId,
          command: msg.command,
          params: msg.params
        }}, '*');
      };
    }

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg || msg.type !== 'result') return;

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          requestId: msg.requestId,
          result: msg.result,
          error: msg.error
        }));
        addLog(`→ result (${msg.requestId}) ${msg.error ? '❌' : '✓'}`, msg.error ? 'err' : 'ok');
      }
    };

    // The sandbox has no canvas, so images are decoded and shrunk here. Figma
    // only takes PNG/JPEG/GIF up to 4096px; anything else is re-encoded.
    const FIGMA_TYPES = ['image/png', 'image/jpeg', 'image/gif'];
    const FIGMA_MAX = 4096;

    function b64ToBytes(b64) {
      const bin = atob(b64); const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    function bytesToB64(bytes) {
      let bin = '';
      for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
      return btoa(bin);
    }

    async function prepareImage(img, maxSize) {
      const limit = Math.min(maxSize || FIGMA_MAX, FIGMA_MAX);
      const bitmap = await createImageBitmap(new Blob([b64ToBytes(img.base64)], { type: img.mime }));
      const scale = Math.min(1, limit / Math.max(bitmap.width, bitmap.height));
      if (scale === 1 && FIGMA_TYPES.includes(img.mime)) { bitmap.close(); return img; }
      const w = Math.round(bitmap.width * scale), h = Math.round(bitmap.height * scale);
      const canvas = new OffscreenCanvas(w, h);
      canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
      bitmap.close();
      const type = img.mime === 'image/png' ? 'image/png' : 'image/jpeg';
      const blob = await canvas.convertToBlob({ type, quality: 0.85 });
      const base64 = bytesToB64(new Uint8Array(await blob.arrayBuffer()));
      return { name: img.name, mime: type, base64, resized: `${w}x${h}` };
    }

    function scheduleReconnect() {
      if (!reconnectTimer) {
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          connect();
        }, 3000);
      }
    }

    function reconnect() {
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      connect();
    }

    connect();
  </script>
</body>
</html>
